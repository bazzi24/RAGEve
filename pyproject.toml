[project]
name = "rageve"
version = "0.1.0"
description = "Local-first RAG platform — Ollama + Qdrant + FastAPI + Next.js. No cloud, no API keys, runs entirely on your machine."
readme = "README.md"
requires-python = ">=3.12"
dependencies = [
    "fastapi>=0.116.0",
    "uvicorn>=0.35.0",
    "httpx>=0.28.1",
    "pydantic-settings>=2.10.1",
    "langchain-text-splitters>=0.3.11",
    "qdrant-client>=1.15.1",
    "pandas>=2.3.2",
    "pymupdf>=1.26.4",
    "pdfplumber>=0.11.0",
    "python-docx>=1.2.0",
    "openpyxl>=3.1.5",
    "pillow>=11.3.0",
    "pytesseract>=0.3.13",
    "paddlepaddle>=3.2.2",
    "paddleocr>=3.2.0",
    "python-multipart>=0.0.20",
    "regex>=2025.9.18",
    "huggingface-hub>=1.7.2",
    "pyarrow>=23.0.1",
    "sentence-transformers>=3.3.0",
    "torch>=2.8.0,<2.9.0",
    "datasets>=3.1.0",
    "fastembed>=0.8.0,<1.0.0",
    "slowapi>=0.1.9",
    "sqlalchemy[asyncio]>=2.0",
    "aiomysql>=0.2.0",
    "pymysql>=1.1.0",
    "aiosqlite>=0.21.0",
    "peewee>=3.17.0",
    "email-validator>=2.3.0",
    "python-jose[cryptography]>=3.3.0",
    "passlib[bcrypt]>=1.7.4",
    "bcrypt<4.0",
    "filetype>=1.2.0",  # MIME type detection via magic bytes
    "pytest>=9.0.3",
    # MinIO (S3-compatible) client
    "boto3>=1.35.0",
    # Redis async client
    "redis>=5.0.0",
    # YAML and env loading
    "pyyaml>=6.0",
    "python-dotenv>=1.0.0",
]

[project.optional-dependencies]
test = [
    "pytest>=8.0.0",
]
eval = [
    "ragas>=0.3.0",
    "langchain-openai>=0.3.0",
    "anthropic>=0.40.0",
]
dev = [
    "black>=24.0.0",
    "isort>=5.13.0",
    "flake8>=7.0.0",
    "flake8-bugbear>=24.9.1",
    "mypy>=1.0.0",
    "types-requests>=2.0.0",
    "types-PyMySQL",
]

[tool.setuptools]
packages = ["backend"]

[tool.isort]
profile = "black"

[flake8]
max-line-length = 88
extend-ignore = ["E203", "W503"]

[build-system]
requires = ["setuptools>=61.0"]
build-backend = "setuptools.build_meta"

[tool.black]
line-length = 88
target-version = ["py312"]
