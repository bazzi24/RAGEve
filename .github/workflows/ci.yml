name: CI

on:
  pull_request:
    branches: [main]
  push:
    branches: [main]

jobs:
  test-backend:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false

    services:
      qdrant:
        image: qdrant/qdrant:latest
        ports:
          - 6333:6333
      ollama:
        image: ollama/ollama:latest
        ports:
          - 11434:11434
      redis:
        image: redis:7-alpine
        ports:
          - 6379:6379

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Set up Python
        uses: actions/setup-python@v6
        with:
          python-version: '3.12'

      - name: Install uv
        run: |
          curl -LsSf https://astral.sh/uv/install.sh | sh
          echo "$HOME/.cargo/bin" >> $GITHUB_PATH

      - name: Install dependencies
        run: uv sync --frozen --extra test

      - name: Wait for services
        run: |
          echo "Waiting for Qdrant..."
          for i in {1..60}; do
            if curl -s -f http://localhost:6333/health > /dev/null; then
              echo "Qdrant is ready"
              break
            fi
            sleep 2
          done

          echo "Waiting for Ollama..."
          for i in {1..60}; do
            if curl -s -f http://localhost:11434/api/tags > /dev/null; then
              echo "Ollama is ready"
              break
            fi
            sleep 2
          done

      - name: Pull Ollama models
        run: |
          echo "Pulling nomic-embed-text:latest..."
          curl -s -X POST http://localhost:11434/api/pull -d '{"name":"nomic-embed-text:latest"}' > /dev/null
          echo "Pulling llama3.2:latest..."
          curl -s -X POST http://localhost:11434/api/pull -d '{"name":"llama3.2:latest"}' > /dev/null

      - name: Wait for Ollama models to load
        run: |
          for i in {1..60}; do
            tags=$(curl -s http://localhost:11434/api/tags)
            if echo "$tags" | grep -q 'nomic-embed-text' && echo "$tags" | grep -q 'llama3.2'; then
              echo "Ollama models loaded"
              break
            fi
            echo "Waiting for models... ($i/60)"
            sleep 5
          done

      - name: Run store unit tests
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: 'rootpassword'
          MYSQL_DBNAME: rag_eve_test
          OLLAMA_BASE_URL: http://localhost:11434
          QDRANT_URL: http://localhost:6333
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""
        run: uv run python test/test_stores.py

      - name: Run API integration tests
        env:
          MYSQL_HOST: localhost
          MYSQL_PORT: 3306
          MYSQL_USER: root
          MYSQL_PASSWORD: 'rootpassword'
          MYSQL_DBNAME: rag_eve_test
          OLLAMA_BASE_URL: http://localhost:11434
          QDRANT_URL: http://localhost:6333
          REDIS_HOST: localhost
          REDIS_PASSWORD: ""
        run: uv run python -m pytest test/api/ -v

      - name: Upload test results
        if: always()
        uses: actions/upload-artifact@v7
        with:
          name: test-results-backend
          path: |
            .pytest_cache/
            htmlcov/
          retention-days: 7

  test-frontend:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v7

      - name: Setup Node.js
        uses: actions/setup-node@v6
        with:
          node-version: '20'
          cache: 'npm'
          cache-dependency-path: frontend/package-lock.json

      - name: Install dependencies
        working-directory: ./frontend
        run: npm ci

      - name: Type check
        working-directory: ./frontend
        run: npx tsc --noEmit

      - name: Lint
        working-directory: ./frontend
        run: npm run lint || echo "No lint script configured"

      - name: Run tests
        working-directory: ./frontend
        run: npm test -- --passWithNoTests || echo "No tests configured"

  test-combined:
    needs: [test-backend, test-frontend]
    runs-on: ubuntu-latest
    steps:
      - name: Check combined status
        run: |
          echo "All tests completed"
        if: success()
